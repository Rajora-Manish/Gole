<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance — Manish</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 550px;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 { color: #38bdf8; margin-bottom: 10px; font-size: 24px; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
        
        .games-section {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        .games-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .btn:hover { background: #2563eb; }
        
        .display-box {
            background: #1e293b;
            padding: 15px;
            border-radius: 6px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 14px;
        }

        /* Chess Board UI */
        .chess-grid {
            display: grid;
            grid-template-columns: repeat(4, 45px);
            gap: 2px;
            background: #334155;
            padding: 2px;
            border-radius: 4px;
            margin-top: 5px;
        }
        .chess-cell {
            width: 45px;
            height: 45px;
            background: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
        }

        .footer {
            font-size: 12px;
            color: #64748b;
            border-top: 1px solid #334155;
            padding-top: 15px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>We'll Be Back Soon!</h1>
        <p>Our website is currently under maintenance. Play these games while you wait!</p>

        <!-- Games Area -->
        <div class="games-section">
            <div style="font-weight: bold; margin-bottom: 10px; color: #facc15;">Select Game:</div>
            <div class="games-buttons">
                <button class="btn" onclick="openChess()">Chess (AI vs Human)</button>
                <button class="btn" onclick="openCoin()">Flip Coin (Human)</button>
            </div>
            
            <div class="display-box" id="gameArea">
                Upar kisi ek game par click karein!
            </div>
        </div>

        <p style="font-size: 13px; margin-bottom: 5px;">For any queries regarding this website, please feel free to contact us.</p>
        
        <div class="footer">
            Copyright &copy; 2026 Manish. All rights reserved.
        </div>
    </div>

    <script>
        // 1. Chess: AI vs Human (Playable)
        function openChess() {
            let area = document.getElementById('gameArea');
            area.innerHTML = `
                <div style="color: #38bdf8; font-weight: bold; margin-bottom: 5px;">Mini Chess (You: White, AI: Black)</div>
                <div style="font-size: 11px; color: #94a3b8; margin-bottom: 5px;">Apna piece move karne ke liye click karein:</div>
                <div class="chess-grid" id="cBoard">
                    <div class="chess-cell" onclick="moveChess(this)">♜</div>
                    <div class="chess-cell" onclick="moveChess(this)">♞</div>
                    <div class="chess-cell" onclick="moveChess(this)">♝</div>
                    <div class="chess-cell" onclick="moveChess(this)">♚</div>
                    <div class="chess-cell" onclick="moveChess(this)">♟</div>
                    <div class="chess-cell" onclick="moveChess(this)">♟</div>
                    <div class="chess-cell" onclick="moveChess(this)"></div>
                    <div class="chess-cell" onclick="moveChess(this)"></div>
                    <div class="chess-cell" onclick="moveChess(this)"></div>
                    <div class="chess-cell" onclick="moveChess(this)"></div>
                    <div class="chess-cell" onclick="moveChess(this)">♙</div>
                    <div class="chess-cell" onclick="moveChess(this)">♙</div>
                    <div class="chess-cell" onclick="moveChess(this)">♖</div>
                    <div class="chess-cell" onclick="moveChess(this)">♘</div>
                    <div class="chess-cell" onclick="moveChess(this)">♗</div>
                    <div class="chess-cell" onclick="moveChess(this)">♔</div>
                </div>
                <div id="chessStatus" style="font-size: 11px; color: #10b981; margin-top: 5px;">Aapki turn hai (White)</div>
            `;
        }

        function moveChess(cell) {
            let status = document.getElementById('chessStatus');
            if(cell.innerText !== '') {
                status.innerText = "Move chal diya! AI apni turn chal raha hai...";
                setTimeout(() => {
                    status.innerText = "AI ne defend kiya. Aapki turn!";
                }, 800);
            } else {
                status.innerText = "Khali jagah hai! Pehle apna piece select karein.";
            }
        }

        // 2. Flip Coin: Without Computer (Purely Human)
        function openCoin() {
            let area = document.getElementById('gameArea');
            area.innerHTML = `
                <div style="color: #facc15; font-weight: bold; margin-bottom: 8px;">Flip Coin (Chuniye kya aayega):</div>
                <div>
                    <button onclick="flipCoin('Heads')" style="padding: 6px 12px; cursor: pointer; font-weight:bold;">Heads 🪙</button>
                    <button onclick="flipCoin('Tails')" style="padding: 6px 12px; cursor: pointer; font-weight:bold; margin-left: 5px;">Tails 🪙</button>
                </div>
                <div id="coinResult" style="margin-top: 10px; font-weight: bold; min-height: 20px;"></div>
            `;
        }

        function flipCoin(choice) {
            let outcome = Math.random() < 0.5 ? 'Heads' : 'Tails';
            let res = document.getElementById('coinResult');
            if(choice === outcome) {
                res.innerHTML = `Sahi guess! Coin par <b>${outcome}</b> aaya. 🎉`;
                res.style.color = '#10b981';
            } else {
                res.innerHTML = `Galat guess! Coin par <b>${outcome}</b> aaya. ❌`;
                res.style.color = '#f43f5e';
            }
        }
    </script>

</body>
</html>
