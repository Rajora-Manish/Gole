<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance — Manish</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background: #030712;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }
        /* Background Glowing Orbs for Cool Effect */
        .glow-orb {
            position: absolute;
            width: 350px;
            height: 350px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            filter: blur(100px);
            border-radius: 50%;
            z-index: -1;
            animation: floatOrb 8s ease-in-out infinite alternate;
        }
        .glow-orb.two {
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            bottom: -50px;
            right: -50px;
            animation-delay: -4s;
        }
        @keyframes floatOrb {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-40px) scale(1.1); }
        }

        .card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 50px 40px;
            border-radius: 24px;
            max-width: 550px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        .badge {
            display: inline-block;
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 800;
            margin-bottom: 15px;
            background: linear-gradient(to right, #ffffff, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #9ca3af;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .contact-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 15px;
            border-radius: 12px;
            font-size: 0.9rem;
            color: #d1d5db;
            margin-bottom: 30px;
        }

        .footer {
            font-size: 0.85rem;
            color: #6b7280;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 20px;
        }

        /* Pulsing Dot */
        .pulse-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulse-animation 2s infinite;
        }
        @keyframes pulse-animation {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body>

    <!-- Background Glow Elements -->
    <div class="glow-orb"></div>
    <div class="glow-orb two"></div>

    <div class="card">
        <div class="badge"><span class="pulse-dot"></span> System Upgrade</div>
        <h1>We're Leveling Up</h1>
        <p>We are currently tuning up our infrastructure to bring you something exceptionally awesome. Hang tight, we'll be live very soon!</p>
        
        <div class="contact-box">
            For any queries regarding this website, please feel free to contact us.
        </div>
        
        <div class="footer">
            Copyright &copy; 2026 Manish. All rights reserved.
        </div>
    </div>

</body>
</html>
