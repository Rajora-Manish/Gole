<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance & Arcade — Manish</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', sans-serif;
            background: #030712;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        .glow-orb {
            position: absolute;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            filter: blur(120px);
            border-radius: 50%;
            z-index: -1;
            animation: floatOrb 8s ease-in-out infinite alternate;
        }
        .glow-orb.two {
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            bottom: -50px; right: -50px;
            animation-delay: -4s;
        }
        @keyframes floatOrb {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-40px) scale(1.1); }
        }

        .card {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 30px 25px;
            border-radius: 24px;
            max-width: 650px;
            width: 95%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            margin: 20px 0;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(to right, #ffffff, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #9ca3af;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .arcade-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .arcade-title {
            font-size: 1rem;
            font-weight: 600;
            color: #38bdf8;
            margin-bottom: 10px;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        .game-btn {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #c7d2fe;
            padding: 8px 4px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: 0.2s;
        }
        .game-btn:hover {
            background: rgba(99, 102, 241, 0.35);
            color: #fff;
            transform: translateY(-2px);
        }

        .game-screen {
            background: #0b0f19;
            border-radius: 12px;
            padding: 15px;
            min-height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }

        /* Chess Board Styles */
        .chess-container {
            display: grid;
            grid-template-columns: repeat(4, 45px);
            grid-template-rows: repeat(4, 45px);
            gap: 1px;
            background: #374151;
            padding: 2px;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .chess-square {
            width: 45px; height: 45px;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.5rem; cursor: pointer; user-select: none;
        }
        .light { background: #e5e7eb; color: #111; }
        .dark { background: #4b5563; color: #fff; }
        .selected { background: #38bdf8 !important; }

        /* Candy Match Styles */
        .candy-board {
            display: grid;
            grid-template-columns: repeat(4, 45px);
            gap: 6px;
        }
        .candy-tile {
            width: 45px; height: 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.4rem; cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        .candy-tile:hover { background: rgba(255, 255, 255, 0.15); }
        .candy-tile.matched { transform: scale(0.8); opacity: 0.3; }

        .action-btn {
            background: #10b981; color: white; border: none; padding: 6px 14px;
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.8rem;
            margin-top: 10px;
        }
        .action-btn:hover { background: #059669; }

        .footer {
            font-size: 0.8rem;
            color: #6b7280;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 12px;
        }
        .query-text {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <div class="glow-orb"></div>
    <div class="glow-orb two"></div>

    <div class="card">
        <h1>We're Leveling Up</h1>
        <p>Our site is under maintenance. Play these interactive mini-games while you wait!</p>
        
        <div class="arcade-box">
            <div class="arcade-title">🎮 Arcade Center (Human vs AI)</div>
            <div class="game-grid">
                <button class="game-btn" onclick="loadGame('chess')">Mini Chess</button>
                <button class="game-btn" onclick="loadGame('candy')">Candy Match</button>
                <button class="game-btn" onclick="loadGame('coin')">Flip Coin</button>
                <button class="game-btn" onclick="loadGame('dice')">Roll Dice</button>
            </div>

            <div class="game-screen" id="gameScreen">
                <p style="color: #6b7280; margin:0;">Select any game above to start playing!</p>
            </div>
        </div>

        <div class="query-text">
            For any queries regarding this website, please feel free to contact us.
        </div>
        
        <div class="footer">
            Copyright &copy; 2026 Manish. All rights reserved.
        </div>
    </div>

    <script>
        function loadGame(type) {
            const screen = document.getElementById('gameScreen');
            if(type === 'chess') {
                initChess();
            } else if(type === 'candy') {
                initCandyMatch();
            } else if(type === 'coin') {
                screen.innerHTML = `
                    <p style="color:#facc15; font-weight:600; margin-bottom:8px;">Flip Coin Challenge</p>
                    <div style="display:flex; gap:10px; margin-bottom:10px;">
                        <button class="action-btn" style="background:#3b82f6;" onclick="playCoin('Heads')">Heads 🪙</button>
                        <button class="action-btn" style="background:#ec4899;" onclick="playCoin('Tails')">Tails 🪙</button>
                    </div>
                    <div id="coinResult" style="font-size:0.9rem; color:#fff; min-height:24px;"></div>
                `;
            } else if(type === 'dice') {
                screen.innerHTML = `
                    <p style="color:#38bdf8; font-weight:600; margin-bottom:8px;">Roll Dice vs Computer</p>
                    <button class="action-btn" onclick="playDice()">Roll Dice 🎲</button>
                    <div id="diceResult" style="font-size:0.9rem; color:#fff; margin-top:10px; min-height:30px;"></div>
                `;
            }
        }

        /* --- MINI CHESS LOGIC (4x4 Simplified Interactive) --- */
        let chessBoardState = [
            ['♜', '♞', '♝', '♚'],
            ['♟', '♟', '♟', '♟'],
            ['', '', '', ''],
            ['♙', '♙', '♙', '♙']
        ];
        let selectedSquare = null;

        function initChess() {
            renderChessBoard();
        }

        function renderChessBoard() {
            const screen = document.getElementById('gameScreen');
            let html = `
                <p style="color:#38bdf8; font-weight:600; margin-bottom:5px;">Mini Chess (You: White, AI: Black)</p>
                <div class="chess-container" id="chessGrid"></div>
                <div id="chessStatus" style="color:#10b981; font-size:0.8rem; margin-top:6px;">Your Turn: Click your piece (White)</div>
            `;
            screen.innerHTML = html;
            const grid = document.getElementById('chessGrid');
            
            for(let r=0; r<4; r++) {
                for(let c=0; c<4; c++) {
                    let sq = document.createElement('div');
                    sq.className = `chess-square ${(r+c)%2 === 0 ? 'light' : 'dark'}`;
                    sq.innerText = chessBoardState[r][c];
                    sq.onclick = () => handleChessClick(r, c);
                    grid.appendChild(sq);
                }
            }
        }

        function handleChessClick(r, c) {
            let status = document.getElementById('chessStatus');
            if(selectedSquare === null) {
                if(chessBoardState[r][c] !== '' && chessBoardState[r][c] === chessBoardState[r][c].toUpperCase() && chessBoardState[r][c] !== '') {
                    selectedSquare = {r, c};
                    status.innerText = "Piece selected. Click empty square to move.";
                } else {
                    status.innerText = "Select your own piece (White lowercase/uppercase check)!";
                }
            } else {
                if(chessBoardState[r][c] === '') {
                    chessBoardState[r][c] = chessBoardState[selectedSquare.r][selectedSquare.c];
                    chessBoardState[selectedSquare.r][selectedSquare.c] = '';
                    selectedSquare = null;
                    renderChessBoard();
                    status.innerText = "AI is thinking...";
                    setTimeout(aiChessMove, 800);
                } else {
                    selectedSquare = null;
                    status.innerText = "Move cancelled. Select again.";
                }
            }
        }

        function aiChessMove() {
            // Simple random AI move for black pieces
            let blackPieces = [];
            for(let r=0; r<4; r++) {
                for(let c=0; c<4; c++) {
                    if(['♜', '♞', '♝', '♚', '♟'].includes(chessBoardState[r][c])) {
                        blackPieces.push({r, c});
                    }
                }
            }
            if(blackPieces.length > 0) {
                let piece = blackPieces[Math.floor(Math.random() * blackPieces.length)];
                let emptySpots = [];
                let moves = [[1,0], [0,1], [-1,0], [0,-1]];
                moves.forEach(m => {
                    let nr = piece.r + m[0], nc = piece.c + m[1];
                    if(nr>=0 && nr<4 && nc>=0 && nc<4 && chessBoardState[nr][nc] === '') {
                        emptySpots.push({r: nr, c: nc});
                    }
                });
                if(emptySpots.length > 0) {
                    let dest = emptySpots[Math.floor(Math.random() * emptySpots.length)];
                    chessBoardState[dest.r][dest.c] = chessBoardState[piece.r][piece.c];
                    chessBoardState[piece.r][piece.c] = '';
                }
            }
            renderChessBoard();
            document.getElementById('chessStatus').innerText = "Your Turn (White)";
        }


        /* --- CANDY CRUSH MATCHING GAME LOGIC --- */
        const candyIcons = ['🍬', '🍫', '🍭', '⭐', '🧁'];
        let candyScore = 0;
        let selectedCandy = null;

        function initCandyMatch() {
            candyScore = 0;
            renderCandyGrid();
        }

        function renderCandyGrid() {
            const screen = document.getElementById('gameScreen');
            screen.innerHTML = `
                <p style="color:#f43f5e; font-weight:600; margin-bottom:4px;">Candy Crush Match (Score: <span id="cScore">${candyScore}</span>)</p>
                <p style="color:#9ca3af; font-size:0.75rem; margin-bottom:8px;">Click two adjacent candies to swap & match!</p>
                <div class="candy-board" id="cBoard"></div>
                <button class="action-btn" style="padding:4px 10px; font-size:0.75rem;" onclick="initCandyMatch()">Reset Board</button>
            `;
            let board = document.getElementById('cBoard');
            
            // Generate 16 random candies matrix
            window.candyMatrix = [];
            for(let i=0; i<4; i++) {
                let row = [];
                for(let j=0; j<4; j++) {
                    row.push(candyIcons[Math.floor(Math.random() * candyIcons.length)]);
                }
                window.candyMatrix.push(row);
            }
            drawCandyMatrix();
        }

        function drawCandyMatrix() {
            let board = document.getElementById('cBoard');
            board.innerHTML = '';
            for(let r=0; r<4; r++) {
                for(let c=0; c<4; c++) {
                    let tile = document.createElement('div');
                    tile.className = 'candy-tile';
                    tile.innerText = window.candyMatrix[r][c];
                    tile.onclick = () => handleCandyClick(r, c);
                    board.appendChild(tile);
                }
            }
        }

        function handleCandyClick(r, c) {
            if(!selectedCandy) {
                selectedCandy = {r, c};
                event.target.style.background = 'rgba(56, 189, 248, 0.3)';
            } else {
                // Swap logic
                let temp = window.candyMatrix[selectedCandy.r][selectedCandy.c];
                window.candyMatrix[selectedCandy.r][selectedCandy.c] = window.candyMatrix[r][c];
                window.candyMatrix[r][c] = temp;
                
                candyScore += 15;
                document.getElementById('cScore').innerText = candyScore;
                selectedCandy = null;
                drawCandyMatrix();
            }
        }


        /* --- FLIP COIN & ROLL DICE LOGIC --- */
        function playCoin(userChoice) {
            let outcome = Math.random() < 0.5 ? 'Heads' : 'Tails';
            let res = document.getElementById('coinResult');
            if(userChoice === outcome) {
                res.innerHTML = `Landed on <b>${outcome}</b>. You Won! 🎉`;
                res.style.color = '#10b981';
            } else {
                res.innerHTML = `Landed on <b>${outcome}</b>. Computer Won! 🤖`;
                res.style.color = '#f43f5e';
            }
        }

        function playDice() {
            let userRoll = Math.floor(Math.random() * 6) + 1;
            let compRoll = Math.floor(Math.random() * 6) + 1;
            let res = document.getElementById('diceResult');
            let text = `You: <b>${userRoll} 🎲</b> | Computer: <b>${compRoll} 🎲</b><br>`;
            if(userRoll > compRoll) text += "<span style='color:#10b981;'>You beat the Computer! 🏆</span>";
            else if(userRoll < compRoll) text += "<span style='color:#f43f5e;'>Computer wins! 🤖</span>";
            else text += "<span style='color:#facc15;'>It's a Tie! 🤝</span>";
            res.innerHTML = text;
        }
    </script>
</body>
</html>
