<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance & Arcade — Manish</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', sans-serif;
            background: #030712;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        .glow-orb {
            position: absolute;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            filter: blur(120px);
            border-radius: 50%;
            z-index: -1;
            animation: floatOrb 8s ease-in-out infinite alternate;
        }
        .glow-orb.two {
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            bottom: -50px; right: -50px;
            animation-delay: -4s;
        }
        @keyframes floatOrb {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-40px) scale(1.1); }
        }

        .card {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 30px 25px;
            border-radius: 24px;
            max-width: 650px;
            width: 95%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            margin: 20px 0;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(to right, #ffffff, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #9ca3af;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .arcade-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .arcade-title {
            font-size: 1rem;
            font-weight: 600;
            color: #38bdf8;
            margin-bottom: 10px;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        .game-btn {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #c7d2fe;
            padding: 8px 4px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: 0.2s;
        }
        .game-btn:hover {
            background: rgba(99, 102, 241, 0.35);
            color: #fff;
            transform: translateY(-2px);
        }

        .game-screen {
            background: #0b0f19;
            border-radius: 12px;
            padding: 15px;
            min-height: 260px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }

        /* Chess Board Styles (8x8 Playable) */
        .chess-board-full {
            display: grid;
            grid-template-columns: repeat(8, 32px);
            grid-template-rows: repeat(8, 32px);
            border: 2px solid #374151;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .chess-tile {
            width: 32px; height: 32px;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.1rem; cursor: pointer; user-select: none;
        }
        .c-light { background: #f0d9b5; color: #000; }
        .c-dark { background: #b58863; color: #000; }
        .c-selected { background: #38bdf8 !important; }

        /* Candy Match Grid */
        .candy-grid-real {
            display: grid;
            grid-template-columns: repeat(4, 45px);
            gap: 6px;
        }
        .candy-box-tile {
            width: 45px; height: 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.4rem; cursor: pointer;
        }
        .candy-box-tile:hover { background: rgba(255, 255, 255, 0.15); }

        .action-btn {
            background: #10b981; color: white; border: none; padding: 6px 14px;
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.8rem;
            margin-top: 8px;
        }
        .action-btn:hover { background: #059669; }

        .footer {
            font-size: 0.8rem;
            color: #6b7280;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 12px;
        }
        .query-text {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <div class="glow-orb"></div>
    <div class="glow-orb two"></div>

    <div class="card">
        <h1>We're Leveling Up</h1>
        <p>Our site is under maintenance. Play these interactive games while you wait!</p>
        
        <div class="arcade-box">
            <div class="arcade-title">🎮 Arcade Center</div>
            <div class="game-grid">
                <button class="game-btn" onclick="loadGame('chess')">Chess</button>
                <button class="game-btn" onclick="loadGame('candy')">Candy Crush</button>
                <button class="game-btn" onclick="loadGame('coin')">Flip Coin</button>
                <button class="game-btn" onclick="loadGame('dice')">Roll Dice</button>
            </div>

            <div class="game-screen" id="gameScreen">
                <p style="color: #6b7280; margin:0;">Select any game above to start playing!</p>
            </div>
        </div>

        <div class="query-text">
            For any queries regarding this website, please feel free to contact us.
        </div>
        
        <div class="footer">
            Copyright &copy; 2026 Manish. All rights reserved.
        </div>
    </div>

    <script>
        function loadGame(type) {
            const screen = document.getElementById('gameScreen');
            if(type === 'chess') {
                initChessGame();
            } else if(type === 'candy') {
                renderCandyCrush();
            } else if(type === 'coin') {
                screen.innerHTML = `
                    <p style="color:#facc15; font-weight:600; margin-bottom:8px;">Flip Coin (Human Only)</p>
                    <div style="display:flex; gap:10px; margin-bottom:10px;">
                        <button class="action-btn" style="background:#3b82f6;" onclick="playCoin('Heads')">Heads 🪙</button>
                        <button class="action-btn" style="background:#ec4899;" onclick="playCoin('Tails')">Tails 🪙</button>
                    </div>
                    <div id="coinResult" style="font-size:1rem; color:#fff; min-height:28px; font-weight:bold;"></div>
                `;
            } else if(type === 'dice') {
                screen.innerHTML = `
                    <p style="color:#38bdf8; font-weight:600; margin-bottom:8px;">Roll Dice vs Computer</p>
                    <button class="action-btn" onclick="playDice()">Roll Dice 🎲</button>
                    <div id="diceResult" style="font-size:0.9rem; color:#fff; margin-top:10px; min-height:30px;"></div>
                `;
            }
        }

        /* --- 1. FUNCTIONAL CHESS (Human vs AI) --- */
        let chessBoard = [
            ['♜','♞','♝','♛','♚','♝','♞','♜'],
            ['♟','♟','♟','♟','♟','♟','♟','♟'],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['♙','♙','♙','♙','♙','♙','♙','♙'],
            ['♖','♘','♗','♕','♔','♗','♘','♖']
        ];
        let selectedPiece = null;

        function initChessGame() {
            renderChessUI();
        }

        function renderChessUI() {
            const screen = document.getElementById('gameScreen');
            screen.innerHTML = `
                <p style="color:#38bdf8; font-weight:600; margin-bottom:3px;">Chess (You: White, AI: Black)</p>
                <div class="chess-board-full" id="chessGridUI"></div>
                <div id="chessMsg" style="color:#10b981; font-size:0.75rem;">Your turn: Click your piece (White)</div>
            `;
            let grid = document.getElementById('chessGridUI');
            for(let r=0; r<8; r++) {
                for(let c=0; c<8; c++) {
                    let tile = document.createElement('div');
                    tile.className = `chess-tile ${(r+c)%2 === 0 ? 'c-light' : 'c-dark'}`;
                    tile.innerText = chessBoard[r][c];
                    tile.onclick = () => onChessTileClick(r, c);
                    grid.appendChild(tile);
                }
            }
        }

        function onChessTileClick(r, c) {
            let msg = document.getElementById('chessMsg');
            let clickedVal = chessBoard[r][c];
            // White pieces check
            const whitePieces = ['♙', '♖', '♘', '♗', '♕', '♔'];

            if(!selectedPiece) {
                if(whitePieces.includes(clickedVal)) {
                    selectedPiece = {r, c};
                    msg.innerText = "Piece selected. Click destination cell.";
                } else {
                    msg.innerText = "Please select your own white piece!";
                }
            } else {
                // Move piece
                chessBoard[r][c] = chessBoard[selectedPiece.r][selectedPiece.c];
                chessBoard[selectedPiece.r][selectedPiece.c] = '';
                selectedPiece = null;
                renderChessUI();
                msg.innerText = "AI is thinking...";
                
                setTimeout(makeAIMove, 700);
            }
        }

        function makeAIMove() {
            // Simple automated black piece move simulation
            let blackPieces = [];
            const blackSymbols = ['♟', '♜', '♞', '♝', '♛', '♚'];
            for(let r=0; r<8; r++) {
                for(let c=0; c<8; c++) {
                    if(blackSymbols.includes(chessBoard[r][c])) {
                        blackPieces.push({r, c});
                    }
                }
            }
            if(blackPieces.length > 0) {
                let p = blackPieces[Math.floor(Math.random() * blackPieces.length)];
                let targetR = p.r + 1;
                if(targetR < 8 && chessBoard[targetR][p.c] === '') {
                    chessBoard[targetR][p.c] = chessBoard[p.r][p.c];
                    chessBoard[p.r][p.c] = '';
                }
            }
            renderChessUI();
            document.getElementById('chessMsg').innerText = "Your turn (White)";
        }


        /* --- 2. CANDY CRUSH MATCH PUZZLE --- */
        let candyScore = 0;
        const candiesList = ['🍬', '🍫', '🍭', '⭐', '🧁'];
        
        function renderCandyCrush() {
            candyScore = 0;
            const screen = document.getElementById('gameScreen');
            screen.innerHTML = `
                <p style="color:#f43f5e; font-weight:600; margin-bottom:4px;">Candy Crush Puzzle (Score: <span id="ccScore">0</span>)</p>
                <p style="color:#9ca3af; font-size:0.75rem; margin-bottom:8px;">Click candies to crush and match them!</p>
                <div class="candy-grid-real" id="candyBoardGrid"></div>
                <button class="action-btn" style="padding:4px 10px; font-size:0.75rem;" onclick="renderCandyCrush()">Shuffle</button>
            `;
            let grid = document.getElementById('candyBoardGrid');
            for(let i=0; i<16; i++) {
                let div = document.createElement('div');
                div.className = 'candy-box-tile';
                div.innerText = candiesList[Math.floor(Math.random() * candiesList.length)];
                div.onclick = function() {
                    candyScore += 10;
                    document.getElementById('ccScore').innerText = candyScore;
                    this.innerText = candiesList[Math.floor(Math.random() * candiesList.length)];
                };
                grid.appendChild(div);
            }
        }


        /* --- 3. FLIP COIN (Human Only) & ROLL DICE --- */
        function playCoin(userChoice) {
            let outcome = Math.random() < 0.5 ? 'Heads' : 'Tails';
            let res = document.getElementById('coinResult');
            if(userChoice === outcome) {
                res.innerHTML = `Coin landed on <b>${outcome}</b>! You guessed right! 🎉`;
                res.style.color = '#10b981';
            } else {
                res.innerHTML = `Coin landed on <b>${outcome}</b>! Better luck next time!`;
                res.style.color = '#f43f5e';
            }
        }

        function playDice() {
            let userRoll = Math.floor(Math.random() * 6) + 1;
            let compRoll = Math.floor(Math.random() * 6) + 1;
            let res = document.getElementById('diceResult');
            let text = `You rolled: <b>${userRoll}</b> | Computer rolled: <b>${compRoll}</b><br>`;
            if(userRoll > compRoll) text += "<span style='color:#10b981;'>You Win! 🏆</span>";
            else if(userRoll < compRoll) text += "<span style='color:#f43f5e;'>Computer Wins! 🤖</span>";
            else text += "<span style='color:#facc15;'>It's a Tie! 🤝</span>";
            res.innerHTML = text;
        }
    </script>
</body>
</html>
