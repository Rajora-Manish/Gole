<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance & Games — Manish</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 95%;
            max-width: 600px;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 { color: #38bdf8; margin-bottom: 8px; font-size: 22px; }
        p { color: #94a3b8; font-size: 13px; line-height: 1.4; margin-bottom: 15px; }
        
        .games-section {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #334155;
        }
        
        /* Chess Clickable Text Link Style */
        .chess-trigger {
            color: #38bdf8;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.2s;
        }
        .chess-trigger:hover {
            color: #60a5fa;
        }
        
        .display-box {
            background: #1e293b;
            padding: 10px;
            border-radius: 6px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 13px;
        }

        /* Chess Board Styles */
        #game{
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #status{
            height: 25px;
            font-size: 14px;
            margin-bottom: 5px;
            color: #facc15;
            font-weight: bold;
        }
        #board{
            width: 340px;
            height: 340px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            border: 3px solid #333;
            margin: 0 auto;
        }
        .square{
            width: 42.5px;
            height: 42.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            cursor: pointer;
            box-sizing: border-box;
        }
        .white{ background: #f0d9b5; color: #000; }
        .black{ background: #b58863; color: #000; }
        .selected{ background: #f7ec55 !important; }
        .possible{ box-shadow: inset 0 0 0 4px #35c759; }

        .chess-new-btn {
            margin-top: 8px;
            padding: 6px 18px;
            cursor: pointer;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 11px;
        }
        .chess-new-btn:hover { background: #059669; }

        .footer {
            font-size: 11px;
            color: #64748b;
            border-top: 1px solid #334155;
            padding-top: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>We'll Be Back Soon!</h1>
        <p>Our website is currently under maintenance. Thank you for your patience.</p>

        <!-- Games Area -->
        <div class="games-section">
            <div class="display-box" id="gameArea">
                <!-- Sirf Chess text dikhega, click karne par game open hoga -->
                <span class="chess-trigger" onclick="openChessGame()">Play Chess ♟️</span>
            </div>
        </div>

        <p style="font-size: 12px; margin-bottom: 5px;">For any queries regarding this website, please feel free to contact us.</p>
        
        <div class="footer">
            Copyright &copy; 2026 Manish. All rights reserved.
        </div>
    </div>

    <script>
        // --- CHESS GAME INTEGRATION ---
        const pieces = {
            "r":"♜","n":"♞","b":"♝","q":"♛","k":"♚","p":"♟",
            "R":"♖","N":"♘","B":"♗","Q":"♕","K":"♔","P":"♙"
        };

        let board;
        let selected = null;
        let possible = [];
        let playerTurn = true;
        let gameOver = false;
        let boardElement, statusElement;

        function openChessGame() {
            let area = document.getElementById('gameArea');
            area.innerHTML = `
                <div id="game">
                    <div id="status">Your turn — White</div>
                    <div id="board"></div>
                    <button class="chess-new-btn" onclick="newGame()">New Game</button>
                </div>
            `;
            boardElement = document.getElementById("board");
            statusElement = document.getElementById("status");
            newGame();
        }

        function newGame(){
            board = [
                ["r","n","b","q","k","b","n","r"],
                ["p","p","p","p","p","p","p","p"],
                ["","","","","","","",""],
                ["","","","","","","",""],
                ["","","","","","","",""],
                ["","","","","","","",""],
                ["P","P","P","P","P","P","P","P"],
                ["R","N","B","Q","K","B","N","R"]
            ];
            selected = null;
            possible = [];
            playerTurn = true;
            gameOver = false;
            if(statusElement) statusElement.textContent = "Your turn — White";
            draw();
        }

        function draw(){
            if(!boardElement) return;
            boardElement.innerHTML = "";
            for(let r=0; r<8; r++){
                for(let c=0; c<8; c++){
                    let square = document.createElement("div");
                    square.className = "square " + ((r+c)%2 === 0 ? "white" : "black");

                    if(selected && selected[0] === r && selected[1] === c){
                        square.classList.add("selected");
                    }
                    if(possible.some(m => m[0] === r && m[1] === c)){
                        square.classList.add("possible");
                    }

                    let piece = board[r][c];
                    square.textContent = piece ? pieces[piece] : "";
                    square.onclick = function(){ playerClick(r, c); };
                    boardElement.appendChild(square);
                }
            }
        }

        function playerClick(r, c){
            if(gameOver || !playerTurn) return;
            let piece = board[r][c];

            if(selected){
                let valid = possible.some(m => m[0] === r && m[1] === c);
                if(valid){
                    makeMove(selected[0], selected[1], r, c);
                    selected = null;
                    possible = [];
                    if(!gameOver){
                        playerTurn = false;
                        statusElement.textContent = "PC is thinking...";
                        draw();
                        setTimeout(pcMove, 700);
                    }
                    return;
                }
                selected = null;
                possible = [];
            }

            if(piece && piece === piece.toUpperCase()){
                selected = [r, c];
                possible = getMoves(r, c, board);
            }
            draw();
        }

        function makeMove(r1, c1, r2, c2){
            let captured = board[r2][c2];
            let piece = board[r1][c1];
            board[r2][c2] = piece;
            board[r1][c1] = "";

            if(piece === "P" && r2 === 0) board[r2][c2] = "Q";
            if(piece === "p" && r2 === 7) board[r2][c2] = "q";

            if(captured && captured.toLowerCase() === "k"){
                gameOver = true;
                if(piece === piece.toUpperCase()){
                    statusElement.textContent = "🎉 YOU WIN!";
                } else {
                    statusElement.textContent = "🤖 PC WINS!";
                }
            }
            draw();
        }

        function getMoves(r, c, b){
            let piece = b[r][c];
            if(!piece) return [];
            let white = piece === piece.toUpperCase();
            let type = piece.toLowerCase();
            let result = [];

            function add(rr, cc){
                if(rr < 0 || rr > 7 || cc < 0 || cc > 7) return false;
                let target = b[rr][cc];
                if(target === ""){
                    result.push([rr, cc]);
                    return true;
                }
                if(target && (target === target.toUpperCase()) !== white){
                    result.push([rr, cc]);
                }
                return false;
            }

            if(type === "p"){
                let direction = white ? -1 : 1;
                let start = white ? 6 : 1;
                if(r + direction >= 0 && r + direction < 8 && b[r + direction][c] === ""){
                    result.push([r + direction, c]);
                    if(r === start && b[r + 2 * direction][c] === ""){
                        result.push([r + 2 * direction, c]);
                    }
                }
                for(let dc of [-1, 1]){
                    let rr = r + direction;
                    let cc = c + dc;
                    if(rr >= 0 && rr < 8 && cc >= 0 && cc < 8 && b[rr][cc] && b[rr][cc] !== "" && (b[rr][cc] === b[rr][cc].toUpperCase()) !== white){
                        result.push([rr, cc]);
                    }
                }
            }

            if(type === "n"){
                let jumps = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
                for(let j of jumps) add(r + j[0], c + j[1]);
            }

            if(type === "k"){
                for(let dr=-1; dr<=1; dr++){
                    for(let dc=-1; dc<=1; dc++){
                        if(dr !== 0 || dc !== 0) add(r + dr, c + dc);
                    }
                }
            }

            if(type === "b" || type === "q"){
                slide([[1,1],[1,-1],[-1,1],[-1,-1]]);
            }

            if(type === "r" || type === "q"){
                slide([[1,0],[-1,0],[0,1],[0,-1]]);
            }

            function slide(directions){
                for(let d of directions){
                    let rr = r + d[0];
                    let cc = c + d[1];
                    while(rr >= 0 && rr < 8 && cc >= 0 && cc < 8){
                        if(!add(rr, cc)) break;
                        rr += d[0];
                        cc += d[1];
                    }
                }
            }
            return result;
        }

        function pcMove(){
            if(gameOver) return;
            let all = [];
            for(let r=0; r<8; r++){
                for(let c=0; c<8; c++){
                    let piece = board[r][c];
                    if(piece && piece === piece.toLowerCase()){
                        let moves = getMoves(r, c, board);
                        for(let m of moves){
                            all.push({ r1: r, c1: c, r2: m[0], c2: m[1], capture: board[m[0]][m[1]] !== "" });
                        }
                    }
                }
            }

            if(all.length === 0){
                gameOver = true;
                statusElement.textContent = "🎉 YOU WIN!";
                return;
            }

            let captures = all.filter(x => x.capture);
            let choices = captures.length ? captures : all;
            let move = choices[Math.floor(Math.random() * choices.length)];

            makeMove(move.r1, move.c1, move.r2, move.c2);

            if(!gameOver){
                playerTurn = true;
                statusElement.textContent = "Your turn — White";
                draw();
            }
        }
    </script>

</body>
</html>
