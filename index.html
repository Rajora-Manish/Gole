<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance & Arcade — Manish</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', sans-serif;
            background: #030712;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        .glow-orb {
            position: absolute;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            filter: blur(120px);
            border-radius: 50%;
            z-index: -1;
            animation: floatOrb 8s ease-in-out infinite alternate;
        }
        .glow-orb.two {
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            bottom: -50px; right: -50px;
            animation-delay: -4s;
        }
        @keyframes floatOrb {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-40px) scale(1.1); }
        }

        .card {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 35px 30px;
            border-radius: 24px;
            max-width: 650px;
            width: 95%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            margin: 20px 0;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(to right, #ffffff, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #9ca3af;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        /* Arcade Section */
        .arcade-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .arcade-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #38bdf8;
            margin-bottom: 12px;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        .game-btn {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #c7d2fe;
            padding: 8px 5px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: 0.2s;
        }
        .game-btn:hover {
            background: rgba(99, 102, 241, 0.35);
            color: #fff;
            transform: translateY(-2px);
        }

        /* Game Screen Area */
        .game-screen {
            background: #0b0f19;
            border-radius: 12px;
            padding: 20px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }

        /* Specific Game Layouts */
        .chess-board {
            display: grid;
            grid-template-columns: repeat(4, 40px);
            gap: 2px;
            background: #374151;
            padding: 2px;
            border-radius: 6px;
        }
        .chess-cell {
            width: 40px; height: 40px;
            background: #1f2937;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.2rem; cursor: pointer; color: #fff;
        }
        .chess-cell:nth-child(odd) { background: #111827; }

        .candy-grid {
            display: grid;
            grid-template-columns: repeat(4, 40px);
            gap: 5px;
        }
        .candy-cell {
            width: 40px; height: 40px;
            background: #1f2937; border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.2rem; cursor: pointer;
            transition: transform 0.1s;
        }
        .candy-cell:active { transform: scale(0.9); }

        .action-btn {
            background: #10b981; color: white; border: none; padding: 8px 16px;
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem;
            margin-top: 10px;
        }
        .action-btn:hover { background: #059669; }

        .footer {
            font-size: 0.8rem;
            color: #6b7280;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 15px;
        }
        .query-text {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="glow-orb"></div>
    <div class="glow-orb two"></div>

    <div class="card">
        <h1>We're Leveling Up</h1>
        <p>Our site is under maintenance. Play these Computer vs Human games while you wait!</p>
        
        <!-- Arcade Hub -->
        <div class="arcade-box">
            <div class="arcade-title">🎮 Choose Your Game</div>
            <div class="game-grid">
                <button class="game-btn" onclick="loadGame('chess')">Mini Chess</button>
                <button class="game-btn" onclick="loadGame('candy')">Candy Match</button>
                <button class="game-btn" onclick="loadGame('coin')">Flip Coin</button>
                <button class="game-btn" onclick="loadGame('dice')">Roll Dice</button>
            </div>

            <!-- Game Display Area -->
            <div class="game-screen" id="gameScreen">
                <p style="color: #6b7280; margin:0;">Click a game above to challenge the Computer!</p>
            </div>
        </div>

        <div class="query-text">
            For any queries regarding this website, please feel free to contact us.
        </div>
        
        <div class="footer">
            Copyright &copy; 2026 Manish. All rights reserved.
        </div>
    </div>

    <script>
        function loadGame(type) {
            const screen = document.getElementById('gameScreen');
            if(type === 'chess') {
                screen.innerHTML = `
                    <p style="color:#38bdf8; margin-bottom:5px; font-weight:600;">Mini Chess (You vs AI)</p>
                    <p style="color:#9ca3af; font-size:0.75rem; margin-bottom:8px;">Capture opponent pieces!</p>
                    <div class="chess-board">
                        <div class="chess-cell" onclick="playChess(this)">♜</div>
                        <div class="chess-cell" onclick="playChess(this)">♞</div>
                        <div class="chess-cell" onclick="playChess(this)">♝</div>
                        <div class="chess-cell" onclick="playChess(this)">♚</div>
                        <div class="chess-cell" onclick="playChess(this)">♟</div>
                        <div class="chess-cell" onclick="playChess(this)">♟</div>
                        <div class="chess-cell" onclick="playChess(this)"></div>
                        <div class="chess-cell" onclick="playChess(this)"></div>
                        <div class="chess-cell" onclick="playChess(this)"></div>
                        <div class="chess-cell" onclick="playChess(this)"></div>
                        <div class="chess-cell" onclick="playChess(this)">♙</div>
                        <div class="chess-cell" onclick="playChess(this)">♙</div>
                        <div class="chess-cell" onclick="playChess(this)">♖</div>
                        <div class="chess-cell" onclick="playChess(this)">♘</div>
                        <div class="chess-cell" onclick="playChess(this)">♗</div>
                        <div class="chess-cell" onclick="playChess(this)">♔</div>
                    </div>
                    <div id="chessStatus" style="color:#10b981; font-size:0.8rem; margin-top:8px;">Your Turn (White)</div>
                `;
            } else if(type === 'candy') {
                screen.innerHTML = `
                    <p style="color:#f43f5e; margin-bottom:5px; font-weight:600;">Candy Crush Match (Score: <span id="candyScore">0</span>)</p>
                    <p style="color:#9ca3af; font-size:0.75rem; margin-bottom:8px;">Click matching sweet items to collect!</p>
                    <div class="candy-grid" id="candyGrid"></div>
                    <button class="action-btn" style="padding:4px 10px; font-size:0.75rem;" onclick="initCandy()">Shuffle Candies</button>
                `;
                initCandy();
            } else if(type === 'coin') {
                screen.innerHTML = `
                    <p style="color:#facc15; margin-bottom:8px; font-weight:600;">Flip Coin: Guess & Beat Computer</p>
                    <div style="display:flex; gap:10px; margin-bottom:10px;">
                        <button class="action-btn" style="background:#3b82f6;" onclick="playCoin('Heads')">Heads 🪙</button>
                        <button class="action-btn" style="background:#ec4899;" onclick="playCoin('Tails')">Tails 🪙</button>
                    </div>
                    <div id="coinResult" style="font-size:0.9rem; color:#fff;"></div>
                `;
            } else if(type === 'dice') {
                screen.innerHTML = `
                    <p style="color:#38bdf8; margin-bottom:8px; font-weight:600;">Roll Dice Challenge (Highest Roll Wins)</p>
                    <button class="action-btn" onclick="playDice()">Roll vs Computer 🎲</button>
                    <div id="diceResult" style="font-size:0.9rem; color:#fff; margin-top:10px;"></div>
                `;
            }
        }

        // Chess AI Simulation Logic
        function playChess(cell) {
            let status = document.getElementById('chessStatus');
            if(cell.innerText !== '') {
                status.innerText = "You captured a piece! 🎯 AI thinking...";
                setTimeout(() => {
                    status.innerText = "AI defended position! Your turn.";
                }, 1000);
            } else {
                status.innerText = "Invalid move! Select a piece.";
            }
        }

        // Candy Crush Mini Logic
        const candies = ['🍬', '🍫', '🍭', '⭐', '🧁'];
        let score = 0;
        function initCandy() {
            score = 0;
            const grid = document.getElementById('candyGrid');
            grid.innerHTML = '';
            for(let i=0; i<16; i++) {
                let randomCandy = candies[Math.floor(Math.random() * candies.length)];
                let div = document.createElement('div');
                div.className = 'candy-cell';
                div.innerText = randomCandy;
                div.onclick = function() {
                    score += 10;
                    document.getElementById('candyScore').innerText = score;
                    this.innerText = candies[Math.floor(Math.random() * candies.length)];
                };
                grid.appendChild(div);
            }
        }

        // Flip Coin (User vs Computer prediction)
        function playCoin(userChoice) {
            let outcome = Math.random() < 0.5 ? 'Heads' : 'Tails';
            let res = document.getElementById('coinResult');
            if(userChoice === outcome) {
                res.innerHTML = `Coin landed on <b>${outcome}</b>. You Won! 🎉`;
                res.style.color = '#10b981';
            } else {
                res.innerHTML = `Coin landed on <b>${outcome}</b>. Computer Won! 🤖`;
                res.style.color = '#f43f5e';
            }
        }

        // Roll Dice (User vs Computer)
        function playDice() {
            let userRoll = Math.floor(Math.random() * 6) + 1;
            let compRoll = Math.floor(Math.random() * 6) + 1;
            let res = document.getElementById('diceResult');
            let text = `You rolled: <b>${userRoll}</b> | Computer rolled: <b>${compRoll}</b><br>`;
            if(userRoll > compRoll) text += "<span style='color:#10b981;'>You beat the Computer! 🏆</span>";
            else if(userRoll < compRoll) text += "<span style='color:#f43f5e;'>Computer wins this round! 🤖</span>";
            else text += "<span style='color:#facc15;'>It's a Tie! 🤝</span>";
            res.innerHTML = text;
        }
    </script>
</body>
</html>
